[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "name-sorter"
version = "1.0.0"
description = "Sorts a list of names by last name, then by given names."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[project.scripts]
name-sorter = "name_sorter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"
